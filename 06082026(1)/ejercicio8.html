       <h2>Comparador de Plataformas de Streaming</h2>
    <form action="ejercicio8.php" method="post">
        <h3>Twitch</h3>
        <label>Horas transmitidas:</label>
        <input type="number" name="twitchHoras" required><br>
        <label>Promedio de espectadores:</label>
        <input type="number" name="twitchViewers" required><br><br>

        <h3>YouTube Gaming</h3>
        <label>Horas transmitidas:</label>
        <input type="number" name="youtubeHoras" required step="0.1"><br>
        <label>Promedio de espectadores:</label>
        <input type="number" name="youtubeViewers" required><br><br>

        <button type="submit">Comparar</button>
    </form>
