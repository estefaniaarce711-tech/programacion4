<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 20</title>
   <style>
    body {
    font-family: Arial, sans-serif;
    background: #f4f6f9;
    margin: 0;
    padding: 0;
}

.contenedor {
    max-width: 400px;
    margin: 50px auto;
    background: #fff;
    padding: 25px;
    border-radius: 8px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
}

h1 {
    text-align: center;
    color: #2c3e50;
    margin-bottom: 20px;
}

label {
    font-weight: bold;
    display: block;
    margin-top: 10px;
}

input[type="number"],
select {
    width: 100%;
    padding: 8px;
    margin-top: 5px;
    border: 1px solid #ccc;
    border-radius: 5px;
}

input[type="submit"] {
    width: 100%;
    padding: 10px;
    margin-top: 20px;
    background: #3498db;
    border: none;
    border-radius: 5px;
    color: #fff;
    font-size: 16px;
    cursor: pointer;
    transition: background 0.3s ease;
}

input[type="submit"]:hover {
    background: #2980b9;
}

.resultado {
    max-width: 400px;
    margin: 40px auto;
    background: #fff;
    padding: 25px;
    border-radius: 8px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
}

.resultado p {
    font-size: 18px;
    background: #ecf0f1;
    padding: 10px;
    border-left: 5px solid #3498db;
    border-radius: 4px;
}


   </style>
</head>
<body>
    <div class="contenedor">
        <h1>Calculadora de cuadrado</h1>
        <form action="ejercicio20.php" method="post">
            <label>Medida del lado del cuadrado:</label>
            <input type="number" name="lado" required>

            <label>Seleccione las operaciones:</label>
            <select name="operacion[]" multiple size="2" required>
                <option value="superficie">Superficie (lado²)</option>
                <option value="perimetro">Perímetro (4 × lado)</option>
            </select>

            <input type="submit" value="Calcular">
        </form>
    </div>
</body>
</html>
