<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 20 con Checkboxes</title>
    <style>
        .contenedor {
    max-width: 400px;
    margin: 50px auto;
    background: #fff;
    padding: 25px;
    border-radius: 8px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
}

h1 {
    text-align: center;
    color: #2c3e50;
    margin-bottom: 20px;
}

label, p {
    font-weight: bold;
    margin-top: 10px;
    display: block;
}

input[type="number"] {
    width: 100%;
    padding: 8px;
    margin-top: 5px;
    border: 1px solid #ccc;
    border-radius: 5px;
}

input[type="checkbox"] {
    margin: 8px 0;
}

input[type="submit"] {
    width: 100%;
    padding: 10px;
    margin-top: 20px;
    background: #3498db;
    border: none;
    border-radius: 5px;
    color: #fff;
    font-size: 16px;
    cursor: pointer;
    transition: background 0.3s ease;
}

input[type="submit"]:hover {
    background: #2980b9;
}

.resultado {
    max-width: 400px;
    margin: 40px auto;
    background: #fff;
    padding: 25px;
    border-radius: 8px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    text-align: center;
}

.resultado p {
    font-size: 18px;
    background: #ecf0f1;
    padding: 10px;
    border-left: 5px solid #3498db;
    border-radius: 4px;
}

    </style>
</head>
<body>
    <div class="contenedor">
        <h1>Calculadora de cuadrado</h1>
        <form action="cuadrado.php" method="post">
            <label>Medida del lado del cuadrado:</label>
            <input type="number" name="lado" required>

            <p>Seleccione las operaciones:</p>
            <input type="checkbox" name="operacion[]" value="superficie"> Superficie (lado²)<br>
            <input type="checkbox" name="operacion[]" value="perimetro"> Perímetro (4 × lado)<br>

            <input type="submit" value="Calcular">
        </form>
    </div>
</body>
</html>
