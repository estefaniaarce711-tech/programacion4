<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 17</title>
  <style>
    /* Estilos generales */
body {
    font-family: Arial, sans-serif;
    background: #f4f6f9;
    margin: 0;
    padding: 0;
}

/* Contenedor */
.contenedor {
    max-width: 500px;
    margin: 50px auto;
    background: #fff;
    padding: 25px;
    border-radius: 8px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
}

/* Título */
h1 {
    text-align: center;
    color: #2c3e50;
    margin-bottom: 20px;
}

/* Etiquetas y campos */
label {
    display: block;
    margin-top: 10px;
    font-weight: bold;
    color: #333;
}

input[type="text"],
input[type="email"],
input[type="date"] {
    width: 100%;
    padding: 8px;
    margin-top: 5px;
    border: 1px solid #ccc;
    border-radius: 5px;
}

/* Botón */
input[type="submit"] {
    width: 100%;
    padding: 10px;
    margin-top: 20px;
    background: #3498db;
    border: none;
    border-radius: 5px;
    color: #fff;
    font-size: 16px;
    cursor: pointer;
    transition: background 0.3s ease;
}

input[type="submit"]:hover {
    background: #2980b9;
}

/* Resultados */
.resultados {
    max-width: 500px;
    margin: 40px auto;
    background: #fff;
    padding: 25px;
    border-radius: 8px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
}

.resultados p {
    background: #ecf0f1;
    padding: 10px;
    border-left: 5px solid #3498db;
    margin: 10px 0;
    border-radius: 4px;
}

  </style>
</head>
<body>
    <div class="contenedor">
        <h1>Formulario de datos personales</h1>
        <form action="ejercicio17.php" method="post">
            <label>Nombre:</label>
            <input type="text" name="nombre" required>

            <label>Apellido:</label>
            <input type="text" name="apellido" required>

            <label>Número de cédula:</label>
            <input type="text" name="cedula" required>

            <label>Número de celular:</label>
            <input type="text" name="celular" required>

            <label>Email:</label>
            <input type="email" name="email" required>

            <label>Fecha de nacimiento:</label>
            <input type="date" name="fecha_nacimiento" required>

            <input type="submit" value="Enviar">
        </form>
    </div>
</body>
</html>
