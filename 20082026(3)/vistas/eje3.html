<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operaciones Matemáticas</title>
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">

    <h2 class="mb-4">Calculadora con PHP</h2>

    <form action="../eje3.php" method="post" class="card p-4 shadow">
        <div class="mb-3">
            <label for="txtn1" class="form-label">Ingrese un número</label>
            <input type="number" name="txtn1" id="txtn1" class="form-control" required placeholder="ej: 3">
        </div>

        <div class="mb-3">
            <label for="txtn2" class="form-label">Ingrese otro número</label>
            <input type="number" name="txtn2" id="txtn2" class="form-control" required placeholder="ej: 3">
        </div>

        <div class="mb-3">
            <label for="cmbop" class="form-label">Operación</label>
            <select name="cmbop" id="cmbop" class="form-select" required>
                <option value="">Seleccione una operación</option>
                <option value="suma">Suma</option>
                <option value="resta">Resta</option>
                <option value="multiplicacion">Multiplicación</option>
                <option value="division">División</option>
                <option value="modulo">Módulo</option>
            </select>
        </div>

        <button type="submit" class="btn btn-info">Calcular</button>
    </form>

</body>
</html>
